<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ problem.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>

    <nav class="navbar">
        <h2>Code<span>Site</span></h2>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="#assignments">Assignments</a>
            <a href="{{ url_for('problems') }}">Problems</a>
            <a href="#progress">My Progress</a>
        </div>

        <div>
            <button class="theme-button" id="theme-toggle" type="button">
                Dark mode
            </button>

            <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="logout-button" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main>
        <a href="{{ url_for('problems') }}">← Back to Problems</a>

        <div class="panel">
            <h1>{{ problem.title }}</h1>
            <p>Difficulty: {{ problem.difficulty }}</p>

            <h2>Description</h2>
            <p>{{ problem.description }}</p>

            {% if message %}
                <p>{{ message }}</p>
            {% endif %}

            <h2>Submit Your Solution</h2>

            <form action="{{ url_for('submit', problem_id=problem.id) }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div id="python-editor"></div>
                <textarea
                    name="source_code"
                    id="source-code"
                    hidden
                    required
                >{{ starter_code }}</textarea>

                <button type="submit">Submit Solution</button>
            </form>
        </div>
    </main>
    
    <script>
        const toggle = document.getElementById("theme-toggle");

        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("codesite-theme", theme);

            toggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
        }

        setTheme(localStorage.getItem("codesite-theme") || "light");

        toggle.addEventListener("click", function () {
            const currentTheme =
                document.documentElement.getAttribute("data-theme");

            setTheme(currentTheme === "dark" ? "light" : "dark");
        });
    </script>

<script type="module">
    import { basicSetup } from "https://esm.sh/codemirror";
    import { EditorView } from "https://esm.sh/@codemirror/view";
    import { python } from "https://esm.sh/@codemirror/lang-python";

    const textarea = document.getElementById("source-code");
    const editorElement = document.getElementById("python-editor");

    const editor = new EditorView({
        doc: textarea.value,
        parent: editorElement,
        extensions: [
            basicSetup,
            python()
        ]
    });

    const form = textarea.closest("form");

    form.addEventListener("submit", function () {
        textarea.value = editor.state.doc.toString();
    });
</script>
</body>
</html>
