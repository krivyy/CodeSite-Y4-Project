<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>

<body>
    <nav class="navbar">
        <h2>Code<span>Site</span></h2>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('problems') }}">Problems</a>
        </div>

        <div>
            <button class="theme-button" id="theme-toggle" type="button">
                Dark mode
            </button>

            <form action="{{ url_for('logout') }}" method="POST" class="logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="logout-button" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <main>
        <h1>Dashboard</h1>
        <section class="panel recent-panel" id="classes">
            <h2>My classes</h2>
            {% if my_classes %}
                <div class="class-grid">
                    {% for class in my_classes %}
                        <a class="class-card" href="{{ url_for('class_stream', class_id=class.id) }}">
                            <h3>{{ class.name }}</h3>
                            <p>Code: <strong>{{ class.join_code }}</strong></p>
                            <p>{{ class.students }} students</p>
                        </a>
                    {% endfor %}
                </div>
            {% else %}
                <p>You haven't created a class yet</p>
            {% endif %}
            <form action="{{ url_for('create_class') }}" method="POST" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="name" placeholder="Class name" maxlength="100" required>
                <button type="submit">Create class</button>
            </form>
        </section>
    </main>

    <script>
        const toggle = document.getElementById("theme-toggle");

        function setTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("codesite-theme", theme);

            toggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
        }

        setTheme(localStorage.getItem("codesite-theme") || "light");

        toggle.addEventListener("click", function () {
            const currentTheme =
                document.documentElement.getAttribute("data-theme");

            setTheme(currentTheme === "dark" ? "light" : "dark");
        });
    </script>
</body>
</html>
